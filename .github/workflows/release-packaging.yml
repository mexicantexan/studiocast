name: release packaging

on:
  workflow_dispatch:
    inputs:
      signing_dry_run:
        description: Generate and verify signed artifacts without publishing a Release
        required: true
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reject-unsafe-signing-request:
    name: Reject signed dispatch outside the default branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.signing_dry_run &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    steps:
      - name: Reject unsafe signing ref
        run: |
          echo "Signed workflow dispatch is restricted to the repository default branch." >&2
          exit 1

  gui-installer-appimage:
    name: Build unsigned GUI installer AppImage (ubuntu-22.04)
    runs-on: ubuntu-22.04
    env:
      RELEASE_PUBLIC_KEY_ID: studiocast-release-2026
      RELEASE_PUBLIC_KEY_PATH: packaging/release/keys/studiocast-release-2026.pem

    steps:
      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-12 g++-12 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            desktop-file-utils file patchelf

      - name: Download pinned AppImage packaging tools
        run: |
          # shellcheck source=/dev/null
          source packaging/appimage/tools.lock

          : "${LINUXDEPLOY_URL:?}"
          : "${LINUXDEPLOY_SHA256:?}"
          : "${LINUXDEPLOY_PLUGIN_QT_URL:?}"
          : "${LINUXDEPLOY_PLUGIN_QT_SHA256:?}"

          download_and_verify() {
            local name="$1"
            local url="$2"
            local sha256="$3"
            local output="$4"

            echo "Downloading pinned ${name}: ${url}"
            curl --fail --location --retry 3 --output "${output}" "${url}"
            printf '%s  %s\n' "${sha256}" "${output}" | sha256sum --check -
            chmod +x "${output}"
          }

          mkdir -p "${HOME}/.local/bin"

          download_and_verify \
            "linuxdeploy ${LINUXDEPLOY_VERSION:-}" \
            "${LINUXDEPLOY_URL}" \
            "${LINUXDEPLOY_SHA256}" \
            "${HOME}/.local/bin/linuxdeploy-x86_64.AppImage"

          download_and_verify \
            "linuxdeploy-plugin-qt ${LINUXDEPLOY_PLUGIN_QT_VERSION:-}" \
            "${LINUXDEPLOY_PLUGIN_QT_URL}" \
            "${LINUXDEPLOY_PLUGIN_QT_SHA256}" \
            "${HOME}/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage"

          ln -sf "${HOME}/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage" \
            "${HOME}/.local/bin/linuxdeploy-plugin-qt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build GUI installer bundle
        env:
          CC: gcc-12
          CXX: g++-12
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          packaging/appimage/build_appimage.sh --clean --appimage-required \
            --trusted-release-key \
            "${RELEASE_PUBLIC_KEY_ID}=${RELEASE_PUBLIC_KEY_PATH}"

      - name: Verify unsigned GUI installer bundle
        run: |
          packaging/appimage/verify_bundle.sh --require-appimage \
            --trusted-release-key \
            "${RELEASE_PUBLIC_KEY_ID}=${RELEASE_PUBLIC_KEY_PATH}"

      - name: Validate unsigned artifact set
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          bundle="StudioCast-Installer-${version}-x86_64"
          expected=(
            "${bundle}.AppImage"
            "${bundle}.AppDir.tar.gz"
            "${bundle}.sha256"
            "StudioCast-${version}-source.tar.gz"
          )

          mapfile -t actual < <(
            find dist/appimage -maxdepth 1 -type f -printf '%f\n' | sort
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#wanted[@]}"
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          test -z "$(find dist/appimage -maxdepth 1 -type l -print -quit)"

      - name: Upload verified unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studiocast-gui-installer-ubuntu-22.04-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/appimage/StudioCast-Installer-*.AppImage
            dist/appimage/StudioCast-Installer-*.AppDir.tar.gz
            dist/appimage/StudioCast-Installer-*.sha256
            dist/appimage/StudioCast-*-source.tar.gz

  sign-release:
    name: Sign and verify release artifacts
    needs:
      - gui-installer-appimage
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.signing_dry_run &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-22.04
    environment: release-signing
    env:
      RELEASE_PUBLIC_KEY_ID: studiocast-release-2026
      RELEASE_PUBLIC_KEY_PATH: packaging/release/keys/studiocast-release-2026.pem
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout trusted signing tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified unsigned release artifacts
        uses: actions/download-artifact@v4
        with:
          name: studiocast-gui-installer-ubuntu-22.04-unsigned
          path: dist/appimage

      - name: Validate unsigned artifact identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git check-ref-format --branch "${DEFAULT_BRANCH}" >/dev/null
          default_branch_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git fetch --no-tags --force origin \
              "+refs/heads/${DEFAULT_BRANCH}:${default_branch_ref}"; then
            echo "Could not fetch repository default branch: ${DEFAULT_BRANCH}" >&2
            exit 2
          fi
          if ! git show-ref --verify --quiet "${default_branch_ref}"; then
            echo "Remote default branch ref is unavailable: ${default_branch_ref}" >&2
            exit 2
          fi
          default_branch_commit="$(git rev-parse --verify "${default_branch_ref}^{commit}")"
          if ! git merge-base --is-ancestor \
              "${expected_commit}" "${default_branch_commit}"; then
            echo "Signing commit is not an ancestor of ${default_branch_ref}." >&2
            exit 2
          fi
          version="$(git show "${expected_commit}:VERSION" | tr -d '[:space:]')"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            test -n "${RELEASE_TAG}"
            test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
            test "${RELEASE_TAG}" = "v${version}"
          else
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
            test "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}"
          fi

          bundle="StudioCast-Installer-${version}-x86_64"
          source_archive="dist/appimage/StudioCast-${version}-source.tar.gz"
          installer_appimage="dist/appimage/${bundle}.AppImage"
          appdir_archive="dist/appimage/${bundle}.AppDir.tar.gz"
          checksum_file="dist/appimage/${bundle}.sha256"
          expected=(
            "$(basename "${installer_appimage}")"
            "$(basename "${appdir_archive}")"
            "$(basename "${checksum_file}")"
            "$(basename "${source_archive}")"
          )

          mapfile -t actual < <(
            find dist/appimage -maxdepth 1 -type f -printf '%f\n' | sort
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq 4
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          test -z "$(find dist/appimage -maxdepth 1 -type l -print -quit)"
          for artifact in "${source_archive}" "${installer_appimage}" \
              "${appdir_archive}" "${checksum_file}"; do
            test -f "${artifact}"
            test ! -L "${artifact}"
          done

          mapfile -t checksum_names < <(awk '{print $2}' "${checksum_file}" | sort)
          mapfile -t checksum_expected < <(
            printf '%s\n' "${expected[0]}" "${expected[1]}" "${expected[3]}" | sort
          )
          test "${#checksum_names[@]}" -eq 3
          test "$(printf '%s\n' "${checksum_names[@]}")" = \
            "$(printf '%s\n' "${checksum_expected[@]}")"
          (cd dist/appimage && sha256sum --check "$(basename "${checksum_file}")")

          archive_commit="$(gzip -cd -- "${source_archive}" | git get-tar-commit-id)"
          test "${archive_commit}" = "${expected_commit}"
          test "$(tar -xOzf "${source_archive}" "StudioCast-${version}/VERSION" | \
            tr -d '[:space:]')" = "${version}"
          tar -xOzf "${appdir_archive}" \
            "${bundle}.AppDir/usr/share/studiocast/source/$(basename "${source_archive}")" | \
            cmp - "${source_archive}"
          tar -xOzf "${appdir_archive}" \
            "${bundle}.AppDir/usr/share/studiocast/installer/trust/keys/${RELEASE_PUBLIC_KEY_ID}.pem" | \
            cmp - "${RELEASE_PUBLIC_KEY_PATH}"

          forbidden='-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----'
          ! tar -xOzf "${source_archive}" | grep -aE -- "${forbidden}" >/dev/null
          ! tar -xOzf "${appdir_archive}" | grep -aE -- "${forbidden}" >/dev/null

          {
            echo "version=${version}"
            echo "expected_commit=${expected_commit}"
            echo "source_archive=${source_archive}"
            echo "installer_appimage=${installer_appimage}"
            echo "appdir_archive=${appdir_archive}"
            echo "checksum_file=${checksum_file}"
          } >> "${GITHUB_ENV}"

      - name: Generate signed stable release manifest
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
        run: |
          : "${RELEASE_SIGNING_KEY_B64:?Signed releases require RELEASE_SIGNING_KEY_B64}"
          : "${RELEASE_SIGNING_KEY_ID:?Signed releases require RELEASE_SIGNING_KEY_ID}"
          test "${RELEASE_SIGNING_KEY_ID}" = "${RELEASE_PUBLIC_KEY_ID}"

          umask 077
          private_key="$(mktemp "${RUNNER_TEMP}/studiocast-release-key.XXXXXX")"
          cleanup_private_key() {
            rm -f -- "${private_key}"
          }
          trap cleanup_private_key EXIT
          printf '%s' "${RELEASE_SIGNING_KEY_B64}" | base64 --decode > "${private_key}"
          unset RELEASE_SIGNING_KEY_B64
          chmod 0600 "${private_key}"
          cmp \
            <(openssl pkey -in "${private_key}" -pubout -outform DER) \
            <(openssl pkey -pubin -in "${RELEASE_PUBLIC_KEY_PATH}" -outform DER)

          python3 packaging/release/release_tool.py \
            --version "${version}" \
            --minimum-installer-version "${version}" \
            --source-archive "${source_archive}" \
            --installer-appimage "${installer_appimage}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}" \
            --release-page-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --commit "${expected_commit}" \
            --workflow-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --private-key "${private_key}" \
            --key-id "${RELEASE_SIGNING_KEY_ID}" \
            --output dist/appimage/studiocast-release-manifest.json \
            --signature-output dist/appimage/studiocast-release-manifest.json.sig
          cleanup_private_key
          trap - EXIT
          unset private_key

      - name: Hermetically verify signed release and packaged trust root
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          python3 packaging/release/verify_signed_release.py \
            --manifest dist/appimage/studiocast-release-manifest.json \
            --signature dist/appimage/studiocast-release-manifest.json.sig \
            --source-archive "${source_archive}" \
            --installer-appimage "${installer_appimage}" \
            --public-key "${RELEASE_PUBLIC_KEY_PATH}" \
            --key-id "${RELEASE_PUBLIC_KEY_ID}"

          # actions/download-artifact does not preserve executable modes.
          chmod 0755 "${installer_appimage}"
          extracted="$(mktemp -d "${RUNNER_TEMP}/studiocast-appimage.XXXXXX")"
          trap 'rm -rf -- "${extracted}"' EXIT
          (cd "${extracted}" && "${GITHUB_WORKSPACE}/${installer_appimage}" \
            --appimage-extract >/dev/null)
          cmp \
            "${RELEASE_PUBLIC_KEY_PATH}" \
            "${extracted}/squashfs-root/usr/share/studiocast/installer/trust/keys/${RELEASE_PUBLIC_KEY_ID}.pem"
          embedded_source="${extracted}/squashfs-root/usr/share/studiocast/source/$(basename "${source_archive}")"
          test -f "${embedded_source}"
          test ! -L "${embedded_source}"
          cmp "${source_archive}" "${embedded_source}"

          forbidden='-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----'
          test -z "$(find "${extracted}/squashfs-root" -type f \
            -exec grep -IlE -- "${forbidden}" {} + || true)"
          ! tar -xOzf "${source_archive}" | grep -aE -- "${forbidden}" >/dev/null
          ! tar -xOzf "${appdir_archive}" | grep -aE -- "${forbidden}" >/dev/null
          test -z "$(find dist/appimage -maxdepth 1 -type f \
            -exec grep -IlE -- "${forbidden}" {} + || true)"

          mapfile -t final_files < <(
            find dist/appimage -maxdepth 1 -type f -printf '%f\n' | sort
          )
          test "${#final_files[@]}" -eq 6
          printf '%s\n' "${final_files[@]}" | grep -Fx \
            'studiocast-release-manifest.json' >/dev/null
          printf '%s\n' "${final_files[@]}" | grep -Fx \
            'studiocast-release-manifest.json.sig' >/dev/null

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studiocast-gui-installer-ubuntu-22.04-signed
          if-no-files-found: error
          path: |
            dist/appimage/StudioCast-Installer-*.AppImage
            dist/appimage/StudioCast-Installer-*.AppDir.tar.gz
            dist/appimage/StudioCast-Installer-*.sha256
            dist/appimage/StudioCast-*-source.tar.gz
            dist/appimage/studiocast-release-manifest.json
            dist/appimage/studiocast-release-manifest.json.sig
