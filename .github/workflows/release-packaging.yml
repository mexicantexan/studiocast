name: release packaging

on:
  workflow_dispatch:
    inputs:
      signing_dry_run:
        description: Generate and verify signed artifacts without publishing a Release
        required: true
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gui-installer-appimage:
    name: GUI installer AppImage (ubuntu-22.04)
    runs-on: ubuntu-22.04
    env:
      RELEASE_PUBLIC_KEY_ID: studiocast-release-2026
      RELEASE_PUBLIC_KEY_PATH: packaging/release/keys/studiocast-release-2026.pem

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-12 g++-12 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            desktop-file-utils file patchelf

      - name: Download pinned AppImage packaging tools
        run: |
          # shellcheck source=/dev/null
          source packaging/appimage/tools.lock

          : "${LINUXDEPLOY_URL:?}"
          : "${LINUXDEPLOY_SHA256:?}"
          : "${LINUXDEPLOY_PLUGIN_QT_URL:?}"
          : "${LINUXDEPLOY_PLUGIN_QT_SHA256:?}"

          download_and_verify() {
            local name="$1"
            local url="$2"
            local sha256="$3"
            local output="$4"

            echo "Downloading pinned ${name}: ${url}"
            curl --fail --location --retry 3 --output "${output}" "${url}"
            printf '%s  %s\n' "${sha256}" "${output}" | sha256sum --check -
            chmod +x "${output}"
          }

          mkdir -p "${HOME}/.local/bin"

          download_and_verify \
            "linuxdeploy ${LINUXDEPLOY_VERSION:-}" \
            "${LINUXDEPLOY_URL}" \
            "${LINUXDEPLOY_SHA256}" \
            "${HOME}/.local/bin/linuxdeploy-x86_64.AppImage"

          download_and_verify \
            "linuxdeploy-plugin-qt ${LINUXDEPLOY_PLUGIN_QT_VERSION:-}" \
            "${LINUXDEPLOY_PLUGIN_QT_URL}" \
            "${LINUXDEPLOY_PLUGIN_QT_SHA256}" \
            "${HOME}/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage"

          ln -sf "${HOME}/.local/bin/linuxdeploy-plugin-qt-x86_64.AppImage" \
            "${HOME}/.local/bin/linuxdeploy-plugin-qt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build GUI installer bundle
        env:
          CC: gcc-12
          CXX: g++-12
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          packaging/appimage/build_appimage.sh --clean --appimage-required \
            --trusted-release-key \
            "${RELEASE_PUBLIC_KEY_ID}=${RELEASE_PUBLIC_KEY_PATH}"

      - name: Generate signed stable release manifest
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.signing_dry_run)
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          : "${RELEASE_SIGNING_KEY_B64:?Signed releases require RELEASE_SIGNING_KEY_B64}"
          : "${RELEASE_SIGNING_KEY_ID:?Signed releases require RELEASE_SIGNING_KEY_ID}"
          test "${RELEASE_SIGNING_KEY_ID}" = "${RELEASE_PUBLIC_KEY_ID}"

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            test "${RELEASE_TAG}" = "v${version}"
          fi
          source_archive="$(find dist/appimage -maxdepth 1 -type f -name "StudioCast-${version}-source.tar.gz" -print -quit)"
          installer_appimage="$(find dist/appimage -maxdepth 1 -type f -name "StudioCast-Installer-${version}-*.AppImage" -print -quit)"
          test -n "${source_archive}"
          test -n "${installer_appimage}"

          private_key="$(mktemp)"
          trap 'rm -f "${private_key}"' EXIT
          chmod 0600 "${private_key}"
          printf '%s' "${RELEASE_SIGNING_KEY_B64}" | base64 --decode > "${private_key}"

          python3 packaging/release/release_tool.py \
            --version "${version}" \
            --minimum-installer-version "${version}" \
            --source-archive "${source_archive}" \
            --installer-appimage "${installer_appimage}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}" \
            --release-page-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --workflow-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --private-key "${private_key}" \
            --key-id "${RELEASE_SIGNING_KEY_ID}" \
            --output dist/appimage/studiocast-release-manifest.json \
            --signature-output dist/appimage/studiocast-release-manifest.json.sig

      - name: Verify GUI installer bundle
        run: |
          packaging/appimage/verify_bundle.sh --require-appimage \
            --trusted-release-key \
            "${RELEASE_PUBLIC_KEY_ID}=${RELEASE_PUBLIC_KEY_PATH}"

      - name: Verify signed stable release
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.signing_dry_run)
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          source_archive="$(find dist/appimage -maxdepth 1 -type f -name "StudioCast-${version}-source.tar.gz" -print -quit)"
          installer_appimage="$(find dist/appimage -maxdepth 1 -type f -name "StudioCast-Installer-${version}-*.AppImage" -print -quit)"
          test -n "${source_archive}"
          test -n "${installer_appimage}"

          python3 packaging/release/verify_signed_release.py \
            --manifest dist/appimage/studiocast-release-manifest.json \
            --signature dist/appimage/studiocast-release-manifest.json.sig \
            --source-archive "${source_archive}" \
            --installer-appimage "${installer_appimage}" \
            --public-key "${RELEASE_PUBLIC_KEY_PATH}" \
            --key-id "${RELEASE_PUBLIC_KEY_ID}"

      - name: Upload release packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studiocast-gui-installer-ubuntu-22.04
          if-no-files-found: error
          path: |
            dist/appimage/StudioCast-Installer-*.AppImage
            dist/appimage/StudioCast-Installer-*.AppDir.tar.gz
            dist/appimage/StudioCast-Installer-*.sha256
            dist/appimage/StudioCast-*-source.tar.gz
            dist/appimage/studiocast-release-manifest.json
            dist/appimage/studiocast-release-manifest.json.sig
