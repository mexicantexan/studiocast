name: ci

on:
  push:
  workflow_dispatch:
    inputs:
      require_cuda_runtime:
        description: "Run the opt-in CUDA runtime self-test that fails on CUDA smoke skips."
        required: false
        type: boolean
        default: false
      cuda_runtime_runner_labels:
        description: "JSON runs-on labels for the opt-in CUDA runtime job."
        required: false
        type: string
        default: '["self-hosted","linux","x64","gpu"]'
      require_vulkan_nvidia_runtime:
        description: "Run opt-in Vulkan runtime smoke tests on an NVIDIA Vulkan runner."
        required: false
        type: boolean
        default: false
      vulkan_nvidia_runner_labels:
        description: "JSON runs-on labels for the opt-in NVIDIA Vulkan job."
        required: false
        type: string
        default: '["self-hosted","linux","x64","nvidia","vulkan"]'
      require_vulkan_amd_runtime:
        description: "Run opt-in Vulkan runtime smoke tests on an AMD Vulkan runner."
        required: false
        type: boolean
        default: false
      vulkan_amd_runner_labels:
        description: "JSON runs-on labels for the opt-in AMD Vulkan job."
        required: false
        type: string
        default: '["self-hosted","linux","x64","amd","vulkan"]'
      require_vulkan_intel_runtime:
        description: "Run opt-in Vulkan runtime smoke tests on an Intel Vulkan runner."
        required: false
        type: boolean
        default: false
      vulkan_intel_runner_labels:
        description: "JSON runs-on labels for the opt-in Intel Vulkan job."
        required: false
        type: string
        default: '["self-hosted","linux","x64","intel","vulkan"]'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-ubuntu:
    name: build + tests + self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          ${{ matrix.cxx }} --version

      - name: Configure (default Open CUDA / no Maxine SDK required)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=OFF \
            -DSTUDIOCAST_ENABLE_CUDA_KERNELS=OFF \
            -DSTUDIOCAST_BUILD_BENCHMARKS=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

  build-mint:
    name: build + tests + self-test (Linux Mint)
    runs-on: ubuntu-24.04
    container:
      image: linuxmintd/mint22-amd64:latest
    steps:
      - name: Install base tools (for checkout)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure (default Open CUDA / no Maxine SDK required)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=OFF \
            -DSTUDIOCAST_ENABLE_CUDA_KERNELS=OFF \
            -DSTUDIOCAST_BUILD_BENCHMARKS=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

  build-enabled-features-no-gpu:
    name: enabled features, no GPU (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates tar \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            libblas-dev liblapack-dev \
            libdlib-dev \
            libvulkan1 vulkan-tools

      - name: Install ONNX Runtime CPU package
        env:
          ORT_VERSION: 1.17.3
          ORT_ARCH: x64
          ORT_FLAVOR: cpu
        run: |
          if [[ "${ORT_FLAVOR}" == "cpu" ]]; then
            ort_name="onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}"
          else
            ort_name="onnxruntime-linux-${ORT_ARCH}-${ORT_FLAVOR}-${ORT_VERSION}"
          fi
          ort_tgz="${ort_name}.tgz"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_tgz}"
          ort_prefix="/opt/studiocast/onnxruntime/${ORT_VERSION}"
          ort_root="${ort_prefix}/${ort_name}"

          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${ort_tgz}" "${ort_url}"
          sudo mkdir -p "${ort_prefix}"
          sudo tar -xzf "${RUNNER_TEMP}/${ort_tgz}" -C "${ort_prefix}"

          test -f "${ort_root}/include/onnxruntime_cxx_api.h"
          ort_libdir="${ort_root}/lib"
          if [[ -d "${ort_root}/lib64" ]]; then
            ort_libdir="${ort_root}/lib64"
          fi

          if [[ ! -e "${ort_libdir}/libonnxruntime.so" ]]; then
            sofile="$(ls -1 "${ort_libdir}"/libonnxruntime.so.* | head -n 1)"
            sudo ln -sf "$(basename "${sofile}")" "${ort_libdir}/libonnxruntime.so"
          fi

          echo "${ort_libdir}" | sudo tee /etc/ld.so.conf.d/studiocast-onnxruntime.conf >/dev/null
          sudo ldconfig

          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/onnxruntime.pc >/dev/null <<EOF
          prefix=${ort_root}
          exec_prefix=\${prefix}
          libdir=${ort_libdir}
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF

          pkg-config --modversion onnxruntime

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++-13 --version
          pkg-config --modversion onnxruntime

      - name: Configure (enabled open features / no GPU required)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=ON \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=ON \
            -DSTUDIOCAST_ENABLE_DLIB=ON \
            -DSTUDIOCAST_BUILD_BENCHMARKS=ON 2>&1 | tee build/configure.log

          grep -Eq '^STUDIOCAST_ENABLE_OPEN_CUDA:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_ENABLE_OPEN_VULKAN:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_ENABLE_OPEN_AUDIO:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_ENABLE_DLIB:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_BUILD_BENCHMARKS:BOOL=ON$' build/CMakeCache.txt
          grep -F 'Open CUDA backend enabled' build/configure.log
          grep -F 'Open Vulkan backend enabled' build/configure.log
          grep -F 'Open Audio backend enabled' build/configure.log
          grep -F 'dlib found' build/configure.log

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

  # Push CI intentionally keeps CUDA smoke skips portable on no-GPU runners.
  # Enable this only on a GPU runner when CUDA runtime failures should fail CI.
  cuda-runtime-smoke:
    name: CUDA runtime self-test (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_cuda_runtime }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cuda_runtime_runner_labels || '["ubuntu-24.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies + GPU ONNX Runtime
        run: |
          ./scripts/setup.sh --deps --onnxruntime-flavor gpu -y

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version
          pkg-config --modversion onnxruntime
          nvidia-smi

      - name: Configure (Open CUDA runtime validation)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF

      - name: Build probe
        run: |
          cmake --build build --target studiocast-probe

      - name: Portable self-test
        run: |
          ./build/studiocast-probe --self-test

      - name: Required CUDA runtime self-test
        run: |
          ./build/studiocast-probe --self-test --require-cuda-runtime

  # Push CI intentionally avoids hard Vulkan runtime requirements. These jobs are
  # opt-in because the runner must provide a real vendor ICD and GPU.
  vulkan-runtime-smoke-nvidia:
    name: Vulkan runtime smoke (NVIDIA, opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_vulkan_nvidia_runtime }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.vulkan_nvidia_runner_labels || '["ubuntu-24.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            libvulkan1 vulkan-tools

      - name: Runtime inventory
        run: |
          nvidia-smi || true
          vulkaninfo --summary

      - name: Configure (Open Vulkan runtime validation)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=OFF \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_BUILD_BENCHMARKS=ON

      - name: Build Vulkan tests and benchmarks
        run: |
          cmake --build build --target \
            studiocast-vulkan-kernel-tests \
            studiocast-resize-backend-bench

      - name: Required Vulkan kernel tests
        run: |
          STUDIOCAST_REQUIRE_VULKAN_RUNTIME=1 \
            ctest --test-dir build -R '^studiocast-vulkan-kernel-tests$' --output-on-failure

      - name: Vulkan resize benchmark smoke
        run: |
          ./build/studiocast-resize-backend-bench --warmup 2 --iterations 3 --csv

  vulkan-runtime-smoke-amd:
    name: Vulkan runtime smoke (AMD, opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_vulkan_amd_runtime }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.vulkan_amd_runner_labels || '["ubuntu-24.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            libvulkan1 vulkan-tools mesa-vulkan-drivers

      - name: Runtime inventory
        run: |
          vulkaninfo --summary

      - name: Configure (Open Vulkan runtime validation)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=OFF \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_BUILD_BENCHMARKS=ON

      - name: Build Vulkan tests and benchmarks
        run: |
          cmake --build build --target \
            studiocast-vulkan-kernel-tests \
            studiocast-resize-backend-bench

      - name: Required Vulkan kernel tests
        run: |
          STUDIOCAST_REQUIRE_VULKAN_RUNTIME=1 \
            ctest --test-dir build -R '^studiocast-vulkan-kernel-tests$' --output-on-failure

      - name: Vulkan resize benchmark smoke
        run: |
          ./build/studiocast-resize-backend-bench --warmup 2 --iterations 3 --csv

  vulkan-runtime-smoke-intel:
    name: Vulkan runtime smoke (Intel, opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_vulkan_intel_runtime }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.vulkan_intel_runner_labels || '["ubuntu-24.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            libvulkan1 vulkan-tools mesa-vulkan-drivers

      - name: Runtime inventory
        run: |
          vulkaninfo --summary

      - name: Configure (Open Vulkan runtime validation)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=OFF \
            -DSTUDIOCAST_ENABLE_OPEN_VULKAN=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_BUILD_BENCHMARKS=ON

      - name: Build Vulkan tests and benchmarks
        run: |
          cmake --build build --target \
            studiocast-vulkan-kernel-tests \
            studiocast-resize-backend-bench

      - name: Required Vulkan kernel tests
        run: |
          STUDIOCAST_REQUIRE_VULKAN_RUNTIME=1 \
            ctest --test-dir build -R '^studiocast-vulkan-kernel-tests$' --output-on-failure

      - name: Vulkan resize benchmark smoke
        run: |
          ./build/studiocast-resize-backend-bench --warmup 2 --iterations 3 --csv

  package-smoke:
    name: package smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            desktop-file-utils python3

      - name: Build package smoke artifacts
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          packaging/appimage/build_appimage.sh --clean --skip-appimage \
            --build-dir "${PWD}/build/ci-package-smoke" \
            --dist-dir "${PWD}/dist/ci-package-smoke"

      - name: Verify package smoke artifacts
        run: |
          packaging/appimage/verify_bundle.sh \
            --dist-dir "${PWD}/dist/ci-package-smoke"
